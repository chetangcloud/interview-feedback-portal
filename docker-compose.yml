services:
  db:
    image: postgres:16-alpine
    container_name: interview-feedback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_feedback
    ports:
      - "5433:5432"
    volumes:
      - interview_feedback_db_data:/var/lib/postgresql/data

volumes:
  interview_feedback_db_data:
